<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control de Inventario Cíclico — Grupo Friopacking</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #F5F7FB;
    color: #101733;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; color: #5B6482; border-bottom: 1px solid #EEF0F8; font-weight: 700; white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid #F5F6FB; color: #101733; white-space: nowrap; }

  /* ---------- login ---------- */
  .login-screen {
    min-height: 100vh;
    background: linear-gradient(160deg, #070F3D, #0B1657 55%, #141F73);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-box { width: 100%; max-width: 400px; }
  .login-logo-wrap { text-align: center; margin-bottom: 28px; }
  .login-logo-wrap p { color: #B7C0E8; margin-top: 14px; font-size: 14px; letter-spacing: 0.4px; }
  .login-card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px; padding: 24px; backdrop-filter: blur(6px);
  }
  .login-hint { color: #DCE1F5; font-size: 13px; margin: 0 0 4px; }
  .btn-role {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; padding: 14px 16px; color: #fff; text-align: left; margin-bottom: 12px;
  }
  .btn-role b { display: block; font-weight: 700; }
  .btn-role span { font-size: 12px; opacity: 0.75; }
  .back-link { background: none; border: none; color: #6FE0C4; font-size: 13px; padding: 0; margin-bottom: 10px; }
  .field-label { display: block; font-size: 12px; color: #B7C0E8; margin-bottom: 6px; }
  .field-label-light { display: block; font-size: 12px; color: #5B6482; margin-bottom: 5px; font-weight: 600; }
  .field-input {
    width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08);
    color: #fff; font-size: 14px; outline: none; margin-bottom: 14px;
  }
  .field-input option { color: #101733; background: #fff; }
  .field-input-light {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #DDE1EF; font-size: 14px; outline: none; color: #101733;
  }
  .error-text { color: #FF9B9B; font-size: 13px; margin: 0 0 10px; }
  .btn-primary-teal {
    width: 100%; background: #2FC6A0; border: none; color: #04241C; font-weight: 700;
    font-size: 14px; padding: 12px 16px; border-radius: 10px;
  }
  .login-footer { text-align: center; color: #5E6A9E; font-size: 11px; margin-top: 18px; }

  /* ---------- topbar ---------- */
  .topbar {
    background: #0B1657; padding: 12px 16px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 10;
  }
  .topbar img { height: 26px; object-fit: contain; }
  .btn-salir {
    display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1);
    border: none; color: #fff; font-size: 13px; padding: 8px 12px; border-radius: 8px;
  }

  /* ---------- generic ---------- */
  .page-op { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .page-gestion { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .page-title { color: #101733; font-size: 19px; margin: 0 0 2px; }
  .page-sub { color: #5B6482; font-size: 13px; margin: 2px 0 18px; }
  .card-center {
    background: #fff; border-radius: 16px; padding: 24px; text-align: center;
    box-shadow: 0 2px 10px rgba(11,22,87,0.06);
  }
  .card-center p.title { color: #101733; font-weight: 600; margin-top: 10px; }
  .card-center p.sub { color: #5B6482; font-size: 13px; margin-bottom: 14px; }
  .btn-dark {
    background: #0B1657; color: #fff; border: none; font-weight: 700; font-size: 14px;
    padding: 11px 18px; border-radius: 10px;
  }
  .btn-dark:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: #EEF0F8; color: #101733; border: none; font-weight: 600; font-size: 14px; padding: 11px 16px; border-radius: 10px; }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #DDE1EF;
    color: #101733; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 9px;
  }
  .progress-track { flex: 1; height: 8px; background: #E3E7F3; border-radius: 999px; }
  .progress-fill { height: 100%; background: #2FC6A0; border-radius: 999px; transition: width .3s; }

  .item-card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(11,22,87,0.06); margin-bottom: 10px; }
  .item-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .item-card-info { display: flex; gap: 10px; }
  .item-card-info p { margin: 0; }
  .item-card-info p.codigo { font-weight: 700; color: #101733; font-size: 14px; }
  .item-card-info p.desc { color: #5B6482; font-size: 13px; margin-top: 2px; }
  .item-card-info p.meta { color: #5B6482; font-size: 12px; margin-top: 2px; }
  .badge-abc {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 8px; font-size: 12px; font-weight: 800; color: #fff; flex-shrink: 0;
  }
  .btn-count {
    background: #2FC6A0; color: #04241C; border: none; font-weight: 700; font-size: 13px;
    padding: 8px 14px; border-radius: 8px; white-space: nowrap;
  }
  .count-form { margin-top: 12px; border-top: 1px solid #EEF0F8; padding-top: 12px; }
  .count-form-grid { display: grid; gap: 10px; }
  .count-form-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .count-form-actions button { flex: 1; min-width: 110px; }

  /* ---------- gestion ---------- */
  .gestion-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .gestion-actions { display: flex; gap: 8px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 10px rgba(11,22,87,0.06); border-top: 3px solid #101733; }
  .kpi-card p.label { margin: 0; font-size: 12px; color: #5B6482; font-weight: 600; }
  .kpi-card p.value { margin: 6px 0 2px; font-size: 24px; font-weight: 800; color: #101733; }
  .kpi-card p.sub { margin: 0; font-size: 12px; color: #5B6482; }
  .panel { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 2px 10px rgba(11,22,87,0.06); margin-bottom: 20px; }
  .panel-title { font-size: 14px; font-weight: 700; color: #101733; margin: 0 0 14px; }
  .panel-scroll { overflow-x: auto; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .bar-label { width: 190px; flex-shrink: 0; color: #101733; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 14px; background: #EEF0F8; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: #141F73; }
  .bar-fill.full { background: #2FC6A0; }
  .bar-pct { width: 42px; text-align: right; color: #5B6482; flex-shrink: 0; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 10px; color: #5B6482; }
  .search-input { width: 260px; padding-left: 30px; }
  .table-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }

  /* ---------- badges ---------- */
  .badge-estado { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .badge-cuadrado { background: #E4F9F1; color: #1C9A7C; }
  .badge-faltante { background: #FDECEC; color: #E5484D; }
  .badge-sobrante { background: #FFF4E1; color: #B9760A; }
  .muted-pendiente { color: #5B6482; font-size: 12px; }

  /* ---------- modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(7,15,61,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(7,15,61,0.35); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-head h3 { margin: 0; font-size: 17px; color: #101733; font-weight: 700; }
  .modal-close { background: none; border: none; cursor: pointer; color: #5B6482; }
  .modal-body p { color: #5B6482; font-size: 14px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn-dark, .modal-actions .btn-ghost { flex: 1; }

  .hidden { display: none !important; }
  svg.icon { vertical-align: -2px; }
  /* ---------- tabs (gestión) ---------- */
  .tabs-bar { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid #E3E7F3; flex-wrap: wrap; }
  .tab-btn {
    background: none; border: none; padding: 10px 16px; font-size: 13px; font-weight: 700;
    color: #5B6482; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: #0B1657; border-bottom-color: #2FC6A0; }

  /* ---------- selección de familias ---------- */
  .familia-select-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #F5F6FB;
  }
  .familia-select-row label { flex: 1; font-size: 13px; color: #101733; cursor: pointer; }
  .familia-select-row .familia-meta { font-size: 12px; color: #5B6482; white-space: nowrap; }
  .familia-group { border-bottom: 1px solid #F5F6FB; }
  .familia-group-header { border-bottom: none; }
  .subgrupos { padding-left: 30px; padding-bottom: 6px; }
  .subgrupo-row { padding: 6px 4px; border-bottom: none; }
  .familia-select-row .aprob-link { white-space: nowrap; }
  .abc-mini { display: inline-flex; gap: 4px; margin-left: 8px; }
  .abc-mini span {
    display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
    border-radius: 5px; font-size: 10px; font-weight: 800; color: #fff; padding: 0 3px;
  }
  .check-lg { width: 18px; height: 18px; flex-shrink: 0; accent-color: #2FC6A0; }
  .lote-status-card { background: #EEF6F3; border: 1px solid #CDEBDF; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #12463A; }
  .lote-status-card strong { color: #0B1657; }

  /* ---------- aprobación ---------- */
  .aprob-row { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 10px rgba(11,22,87,0.06); margin-bottom: 12px; }
  .aprob-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .aprob-check-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #101733; white-space: nowrap; }
  .aprob-link { background: none; border: none; color: #0B1657; font-size: 12px; font-weight: 700; text-decoration: underline; padding: 0; }
  .aprob-form { margin-top: 12px; border-top: 1px solid #EEF0F8; padding-top: 12px; }
  .badge-revision { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .badge-revision.pendiente { background: #FFF4E1; color: #B9760A; }
  .badge-revision.aprobado { background: #E4F9F1; color: #1C9A7C; }
  .badge-revision.rectificado { background: #EDEBFB; color: #6B4FD6; }
  .ajuste-nota { background: #F7F5FF; border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 12px; color: #4A3F8A; }

  /* ---------- histórico ---------- */
  .historico-filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }
  .historico-filtros > div { display: flex; flex-direction: column; gap: 4px; }
  .vuelta-alerta { display:inline-block; background:#FFF4E1; color:#B9760A; border:1px solid #F5D9A0; border-radius:8px; padding:2px 8px; font-size:11px; font-weight:700; white-space:normal; }
  .vuelta-chip { display:inline-block; background:#FFF4E1; color:#B9760A; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:800; margin-left:6px; }
  .alerta-vuelta { background:#FFF4E1; border:1px solid #F5D9A0; border-left:4px solid #F5A623; border-radius:10px; padding:12px 14px; margin:12px 0; font-size:13px; color:#7A4B00; }
  .obs-gestion-input { width:100%; min-width:180px; padding:6px 8px; border-radius:8px; border:1px solid #DDE1EF; font-size:12px; }
  .btn-guardar-obs { background:#0B1657; color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; }
  .filtro-input { padding: 8px 10px; border-radius: 8px; border: 1px solid #DDE1EF; font-size: 13px; }
</style>
</head>

function computeABC(items) {
  const conValor = items.map((it) => Object.assign({}, it, {
    valorizado: +(Number(it.cantidad_sistema) * Number(it.costo_unitario)).toFixed(2),
  }));
  const totalVal = conValor.reduce((s, it) => s + it.valorizado, 0);
  const ordenPorValor = conValor.slice().sort((a, b) => b.valorizado - a.valorizado);
  let acumulado = 0;
  const clasificados = new Map();
  ordenPorValor.forEach((it) => {
    acumulado += it.valorizado;
    const pct = totalVal > 0 ? acumulado / totalVal : 0;
    let clase = "C";
    if (pct <= 0.8) clase = "A";
    else if (pct <= 0.95) clase = "B";
    clasificados.set(it.id, clase);
  });
  return conValor.map((it) => Object.assign({}, it, { clasificacion_abc: clasificados.get(it.id) }));
}

    estado: "pendiente",

}

function idsComprometidos(lotes, items) {
  // Ítems que ya pertenecen a alguna lista generada y aún no han sido finalizados
  // (siguen pendientes o pre-guardados), para no volver a incluirlos en una lista nueva.
  const mapaItems = new Map(items.map((it) => [it.id, it]));
  const set = new Set();
  (lotes || []).forEach((lote) => {
    (lote.ids || []).forEach((id) => {
      const it = mapaItems.get(id);
      if (it && (it.estado === "pendiente" || it.estado === "preguardado")) set.add(id);
    });
  });
  return set;
}

    const itemsSub = items.filter((it) => it.familia === sel.familia && (it.subgrupo || "Sin subgrupo") === sel.subgrupo);
    if (sg.nuevaVuelta) {
      // Subgrupo completamente contado: se abre una nueva vuelta (reconteo de todos sus ítems).
      vueltas[key] = sg.vuelta + 1;
      nuevasVueltas.push({ familia: sel.familia, subgrupo: sel.subgrupo, vueltaAnterior: sg.vuelta, vuelta: sg.vuelta + 1, cantidad: itemsSub.length });
      itemsSub.forEach((it) => { pool.push(it); resetIds.add(it.id); });
    } else {
      vueltas[key] = sg.vuelta;
      itemsSub.filter((it) => it.estado === "pendiente" && !excluir.has(it.id)).forEach((it) => pool.push(it));
    }
  });
  const peso = { A: 0, B: 1, C: 2 };
  const ordenados = pool.slice().sort((a, b) => {
    const w = peso[a.clasificacion_abc] - peso[b.clasificacion_abc];
    if (w !== 0) return w;
    return b.valorizado - a.valorizado;
  });
  return { ids: ordenados.slice(0, size).map((it) => it.id), resetIds, vueltas, nuevasVueltas };
}

function calcularResumenFamiliasPendientes(items, idsExcluir) {
  // Agrupa TODOS los ítems por grupo/subgrupo. Un subgrupo se muestra si tiene ítems
  // disponibles para contar, o si ya fue contado por completo (se puede abrir otra vuelta).
  const excluir = idsExcluir || new Set();
  const mapa = new Map();
  items.forEach((it) => {
    const subKey = it.subgrupo || "Sin subgrupo";
    if (!mapa.has(it.familia)) mapa.set(it.familia, { familia: it.familia, subgrupos: new Map() });
    const f = mapa.get(it.familia);
    if (!f.subgrupos.has(subKey)) f.subgrupos.set(subKey, {
      subgrupo: subKey, pendientes: 0, enCurso: 0, contados: 0, vuelta: 1,
      valorizado: 0, A: 0, B: 0, C: 0, valorizadoTotal: 0, ABCtotal: { A: 0, B: 0, C: 0 },
    });
    const sg = f.subgrupos.get(subKey);
    sg.vuelta = Math.max(sg.vuelta, it.vuelta || 1);
    sg.valorizadoTotal += it.valorizado;
    sg.ABCtotal[it.clasificacion_abc] = (sg.ABCtotal[it.clasificacion_abc] || 0) + 1;
    if (it.estado === "pendiente" && !excluir.has(it.id)) {
      sg.pendientes += 1; sg.valorizado += it.valorizado;
      sg[it.clasificacion_abc] = (sg[it.clasificacion_abc] || 0) + 1;
    } else if (it.estado === "pendiente" || it.estado === "preguardado") {
      sg.enCurso += 1;
    } else if (it.estado === "contado") {
      sg.contados += 1;
    }
  });
  const grupos = [];
  mapa.forEach((f) => {
    const subs = [];
    f.subgrupos.forEach((sg) => {
      sg.nuevaVuelta = sg.pendientes === 0 && sg.enCurso === 0 && sg.contados > 0;
      if (sg.pendientes === 0 && !sg.nuevaVuelta) return;
      if (sg.nuevaVuelta) {
        sg.valorMostrar = sg.valorizadoTotal;
        sg.abcMostrar = sg.ABCtotal;
      } else {
        sg.valorMostrar = sg.valorizado;
        sg.abcMostrar = { A: sg.A, B: sg.B, C: sg.C };
      }
      subs.push(sg);
    });
    if (subs.length === 0) return;
    subs.sort((a, b) => b.valorMostrar - a.valorMostrar);
    grupos.push({
      familia: f.familia, subgrupos: subs,
      pendientes: subs.reduce((t, x) => t + x.pendientes, 0),
      valorizado: subs.reduce((t, x) => t + x.valorMostrar, 0),
      tieneNuevaVuelta: subs.some((x) => x.nuevaVuelta),
    });
  });
  return grupos.sort((a, b) => b.valorizado - a.valorizado);
}

function calcularStatsGlobales(items) {
  const totalItems = items.length;
  let totalValorizado = 0, totalStock = 0;
  const fam = new Map();
  items.forEach((it) => {
    totalValorizado += it.valorizado;
    totalStock += it.cantidad_sistema;
    const prev = fam.get(it.familia) || { items: 0, valorizado: 0, stock: 0 };
    prev.items += 1; prev.valorizado += it.valorizado; prev.stock += it.cantidad_sistema;
    fam.set(it.familia, prev);
  });
  const porFamilia = Array.from(fam.entries())
    .map(([familia, v]) => [familia, v.items, +v.valorizado.toFixed(2), +v.stock.toFixed(3)])
    .sort((a, b) => b[2] - a[2]);
  return {
    stats: { totalItems, totalValorizado: +totalValorizado.toFixed(2), totalStock: +totalStock.toFixed(3) },
    porFamilia,
  };
}

  });

// Trae TODAS las filas de un endpoint de Supabase, sin importar el límite de filas
// por página que tenga configurado el proyecto (evita depender del header Range,
// que puede fallar la verificación CORS en algunos navegadores/hostings).
async function paginarSupabase(rutaBase) {
  const TAMANO_PAGINA = 1000;
  let desde = 0;
  let todas = [];
  while (true) {
    const sep = rutaBase.includes("?") ? "&" : "?";
    const res = await fetch(SUPABASE_URL + rutaBase + sep + "limit=" + TAMANO_PAGINA + "&offset=" + desde, {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
    });
    if (!res.ok) return null;
    const pagina = await res.json();
    todas = todas.concat(pagina);
    if (pagina.length < TAMANO_PAGINA) break;
    desde += TAMANO_PAGINA;
  }
  return todas;
}

// Actualiza/crea UN solo ítem (upsert por id). Uso normal: preguardar, finalizar,

async function persistItemUnico(item) {
  state.items = state.items.map((it) => (it.id === item.id ? item : it));
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/items", {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json", Prefer: "resolution=merge-duplicates",
      },
      body: JSON.stringify([itemAFila(item)]),
    });
    state.storageError = !res.ok;
  } catch (e) { state.storageError = true; }
}

// Actualiza SOLO las filas indicadas (no toca el resto de ítems). Uso: abrir una nueva vuelta.
async function persistItemsParcial(lista) {
  const mapa = new Map(lista.map((it) => [it.id, it]));
  state.items = state.items.map((it) => mapa.get(it.id) || it);
  try {
    const filas = lista.map(itemAFila);
    for (let i = 0; i < filas.length; i += 400) {
      const res = await fetch(SUPABASE_URL + "/rest/v1/items", {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json", Prefer: "resolution=merge-duplicates",
        },
        body: JSON.stringify(filas.slice(i, i + 400)),
      });
      if (!res.ok) { state.storageError = true; return; }
    }
    state.storageError = false;
  } catch (e) { state.storageError = true; }
}

// Sube/actualiza MUCHOS ítems a la vez. Uso: solo para carga masiva de data diaria
// o reinicio de ciclo (acciones de Gestión, no el conteo diario de los operarios).
async function persistItemsBulk(items) {
  state.items = items;
  try {
    const filas = items.map(itemAFila);
    for (let i = 0; i < filas.length; i += 400) {
      const chunk = filas.slice(i, i + 400);
      const res = await fetch(SUPABASE_URL + "/rest/v1/items", {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json", Prefer: "resolution=merge-duplicates",
        },
        body: JSON.stringify(chunk),
      });
      if (!res.ok) { state.storageError = true; return; }
    }
    state.storageError = false;
  } catch (e) { state.storageError = true; }
}

function doIngresar() {
  const credencialesRol = state.loginRol === "operario" ? OPERARIOS_CREDENCIALES : GESTION_CREDENCIALES;
  const selNombre = document.getElementById("selNombre");
  const nombreFinal = selNombre ? selNombre.value : "";
  if (!nombreFinal) {
    state.loginError = "Selecciona tu nombre para continuar.";
    render();
    return;
  }
  const clave = (document.getElementById("inpClave") || {}).value || "";
  const claveEsperada = credencialesRol[nombreFinal];
  if (clave.trim() !== claveEsperada) {
    state.loginError = "Clave incorrecta. Verifica con tu supervisor.";
    render();
    return;
  }
  state.user = { rol: state.loginRol, nombre: nombreFinal };
  state.loginError = ""; state.loginRol = null; state.loginNombre = "";
  render();
}

/* ---------------- GESTIÓN: cálculos ---------------- */

function obtenerCantidadFinal(it) {
  return it.conteo ? (it.conteo.cantidad_final != null ? it.conteo.cantidad_final : it.conteo.cantidad_contada) : null;
}
function obtenerDiferenciaFinal(it) {
  return it.conteo ? (it.conteo.diferencia_valorizada_final != null ? it.conteo.diferencia_valorizada_final : it.conteo.diferencia_valorizada) : 0;
}
function obtenerEstatusFinal(it) {
  return it.conteo ? (it.conteo.estatus_final || it.conteo.estatus) : null;
}

function calcularResumen() {
  const total = state.globalStats.stats.totalItems;
  const contados = state.items.filter((it) => it.estado === "contado").length;
  const valorizadoTotal = state.globalStats.stats.totalValorizado;
  const valorizadoContado = state.items.filter((it) => it.estado === "contado").reduce((s, it) => s + it.valorizado, 0);
  const stockTotal = state.globalStats.stats.totalStock;
  const stockContado = state.items.filter((it) => it.estado === "contado").reduce((s, it) => s + it.cantidad_sistema, 0);
  const diferenciaValorizada = state.items.filter((it) => it.conteo).reduce((s, it) => s + obtenerDiferenciaFinal(it), 0);
  return {
    total, contados, pendientes: Math.max(total - contados, 0),
    pctItems: total ? (contados / total) * 100 : 0,
    valorizadoTotal, valorizadoContado,
    pctValorizado: valorizadoTotal ? (valorizadoContado / valorizadoTotal) * 100 : 0,
    stockTotal, stockContado,
    pctStock: stockTotal ? (stockContado / stockTotal) * 100 : 0,
    diferenciaValorizada,
  };
}

function calcularPorFamilia() {
  const mapa = {};
  state.globalStats.porFamilia.forEach(([familia, itemsTotal, valorizadoTotal, stockTotal]) => {
    mapa[familia] = { familia, total: itemsTotal, contados: 0, valorizadoTotal, valorizadoContado: 0, stockTotal, stockContado: 0, diferencia: 0 };
  });
  state.items.forEach((it) => {
    if (it.estado !== "contado") return;
    if (!mapa[it.familia]) mapa[it.familia] = { familia: it.familia, total: 0, contados: 0, valorizadoTotal: 0, valorizadoContado: 0, stockTotal: 0, stockContado: 0, diferencia: 0 };
    const f = mapa[it.familia];
    f.contados += 1; f.valorizadoContado += it.valorizado; f.stockContado += it.cantidad_sistema;
    f.diferencia += obtenerDiferenciaFinal(it);
  });
  return Object.values(mapa).map((f) => Object.assign({}, f, { pctAvance: f.total ? (f.contados / f.total) * 100 : 0 }))
    .sort((a, b) => b.valorizadoTotal - a.valorizadoTotal);
}

function estadoBadgeHtml(estatus) {
  const map = {
    cuadrado: { cls: "badge-cuadrado", label: "Cuadrado", ic: "check" },
    faltante: { cls: "badge-faltante", label: "Faltante", ic: "down" },
    sobrante: { cls: "badge-sobrante", label: "Sobrante", ic: "up" },
  };
  const cfg = map[estatus] || map.cuadrado;
  return '<span class="badge-estado ' + cfg.cls + '">' + icon(cfg.ic, 14) + cfg.label + '</span>';
}

  const resumen = calcularResumen();
  const porFamilia = calcularPorFamilia();

  const diferencias = state.items.filter((it) => it.conteo && obtenerEstatusFinal(it) !== "cuadrado")
    .sort((a, b) => Math.abs(obtenerDiferenciaFinal(b)) - Math.abs(obtenerDiferenciaFinal(a)));
  const q = state.busqueda.trim().toLowerCase();
  const itemsFiltrados = !q ? state.items : state.items.filter((it) =>
    it.codigo_nisira.toLowerCase().includes(q) || it.descripcion.toLowerCase().includes(q) || it.familia.toLowerCase().includes(q));

  let html = '<div class="kpi-grid">' +

    kpiCardHtml("Avance valorizado", resumen.pctValorizado.toFixed(1) + "%", soles(resumen.valorizadoContado) + " / " + soles(resumen.valorizadoTotal), "#0B1657") +
    kpiCardHtml("Avance por cantidad (stock)", resumen.pctStock.toFixed(1) + "%", cantidadFmt(resumen.stockContado) + " / " + cantidadFmt(resumen.stockTotal) + " unid.", "#1C9A7C") +
    kpiCardHtml("Diferencia valorizada", soles(resumen.diferenciaValorizada), resumen.diferenciaValorizada < 0 ? "Neto faltante" : resumen.diferenciaValorizada > 0 ? "Neto sobrante" : "Sin diferencias", resumen.diferenciaValorizada < 0 ? "#E5484D" : "#F5A623") +
    kpiCardHtml("Ítems pendientes", String(resumen.pendientes), "por contabilizar", "#5B6482") +
    '</div>';

  html += '<div class="panel"><h3 class="panel-title">% de avance por familia (top 15 por valorizado, de ' + porFamilia.length + ' familias)</h3>';
  porFamiliaTop.forEach((f) => {
    const pct = f.pctAvance;
    html += '<div class="bar-row"><span class="bar-label" title="' + esc(f.familia) + '">' + esc(f.familia) + '</span>' +
      '<div class="bar-track"><div class="bar-fill' + (pct >= 100 ? " full" : "") + '" style="width:' + Math.min(pct, 100) + '%;"></div></div>' +
      '<span class="bar-pct">' + pct.toFixed(1) + '%</span></div>';

    '<th>Cant. stock total</th><th>Cant. stock contada</th><th>Diferencia valorizada</th></tr></thead><tbody>';
  porFamilia.forEach((f) => {

      '<th>Estatus</th><th>Dif. valorizada</th><th>Ubicación</th><th>Operario</th></tr></thead><tbody>';

const ESTATUS_LABEL = { cuadrado: "Cuadrado", faltante: "Faltante", sobrante: "Sobrante" };

function construirReporteConteo(soloPersonal) {
  const q = state.historicoBusqueda.trim().toLowerCase();
  const desde = state.historicoDesde ? new Date(state.historicoDesde + "T00:00:00") : null;
  const hasta = state.historicoHasta ? new Date(state.historicoHasta + "T23:59:59") : null;

  const filas = [];
  state.items.forEach((it) => {
    if (q && !(it.codigo_nisira.toLowerCase().includes(q) || it.descripcion.toLowerCase().includes(q) || it.familia.toLowerCase().includes(q))) return;
    // Cada vuelta de conteo es un registro: las anteriores (conteosPrevios) + la vuelta actual.
    const registros = (it.conteosPrevios || []).map((c, i) => ({ c, vuelta: c.vuelta || (i + 1) }));
    if (it.conteo) registros.push({ c: it.conteo, vuelta: it.conteo.vuelta || it.vuelta || 1 });
    registros.forEach(({ c, vuelta }) => {
      if (soloPersonal && c.personal !== soloPersonal) return;
      if (c.fecha) {
        const d = new Date(c.fecha);
        if (desde && d < desde) return;
        if (hasta && d > hasta) return;
      }
      const ajuste = c.ajuste || 0;
      const rectPrevia = ajuste !== 0
        ? ("Rectificación previa: " + (ajuste > 0 ? "+" : "") + ajuste + (c.observacionAjuste ? (" (" + c.observacionAjuste + ")") : ""))
        : "";
      filas.push({
        codigo: it.codigo_nisira, descripcion: it.descripcion, um: it.unidad, stock: it.cantidad_sistema,
        conteo: c.cantidad_base != null ? c.cantidad_base : c.cantidad_contada,
        ubicacion: c.ubicacion || "", estatus: c.estatus_final || c.estatus,
        obsOperario: [c.observacion || "", rectPrevia].filter(Boolean).join(" · "),
        obsGestion: c.observacionGestion || "",
        vuelta, fecha: c.fecha, item: it,
      });
    });
  });

  return filas.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
}

    const clave = f.item.id + "|" + f.vuelta;

    if (editable) {
      celdaGestion = '<input class="obs-gestion-input" data-id="' + esc(f.item.id) + '" data-vuelta="' + f.vuelta + '" placeholder="Agregar observación" value="' + esc(f.obsGestion) + '">';
    } else {

      '<td>' + (f.vuelta > 1 ? ('<span class="vuelta-chip" style="margin-left:0;">' + ordinalVuelta(f.vuelta) + '</span>') : ordinalVuelta(f.vuelta)) + '</td>' +

// Guarda SOLO la observación de Gestión de un registro del histórico. Lee la fila fresca de la
// base de datos antes de escribir, para no pisar un conteo que otro operario haya hecho mientras tanto.
async function guardarObservacionGestion(id, vuelta, texto) {
  let item = null;
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/items?id=eq." + encodeURIComponent(id) + "&select=*", {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
    });
    if (res.ok) { const rows = await res.json(); if (rows.length) item = filaAItem(rows[0]); }
  } catch (e) { /* se usa la copia local */ }
  if (!item) item = state.items.find((x) => x.id === id);
  if (!item) return;
  const meta = { observacionGestion: texto, observacionGestionPor: state.user.nombre, observacionGestionFecha: new Date().toISOString() };
  if (item.conteo && (item.conteo.vuelta || item.vuelta || 1) === vuelta) {
    item = Object.assign({}, item, { conteo: Object.assign({}, item.conteo, meta) });
  } else {
    item = Object.assign({}, item, {
      conteosPrevios: (item.conteosPrevios || []).map((c, i) => ((c.vuelta || (i + 1)) === vuelta ? Object.assign({}, c, meta) : c)),
    });
  }
  await persistItemUnico(item);
}

function exportarHistoricoExcel() {
  const filas = construirReporteConteo(null);
  const datos = filas.map((f) => ({
    "Fecha": f.fecha ? new Date(f.fecha).toLocaleString("es-PE") : "",
    "Vuelta": ordinalVuelta(f.vuelta),
    "Código Producto": f.codigo, "Descripción": f.descripcion, "UM": f.um, "Stock": f.stock,
    "Conteo": f.conteo, "Ubicación": f.ubicacion,
    "Estatus": ESTATUS_LABEL[f.estatus] || f.estatus,
    "Observación operario": f.obsOperario || "", "Observación Gestión": f.obsGestion || "",
  }));
  if (datos.length === 0) datos.push({ "Fecha": "", "Vuelta": "", "Código Producto": "", "Descripción": "Sin registros", "UM": "", "Stock": "", "Conteo": "", "Ubicación": "", "Estatus": "", "Observación operario": "", "Observación Gestión": "" });
  const ws = XLSX.utils.json_to_sheet(datos);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Historico");
  XLSX.writeFile(wb, "historico_conteo_" + hoyISO() + ".xlsx");
}

function generarDashboardDiario() {
  const hoy = hoyISO();
  const itemsHoy = [];
  state.items.forEach((it) => {
    (it.conteosPrevios || []).concat(it.conteo ? [it.conteo] : []).forEach((c) => {
      if (c && c.fecha && c.fecha.slice(0, 10) === hoy) itemsHoy.push(Object.assign({}, it, { conteo: c }));
    });
  });
  const totalHoy = itemsHoy.length;
  const cuadrados = itemsHoy.filter((it) => obtenerEstatusFinal(it) === "cuadrado").length;
  const faltantes = itemsHoy.filter((it) => obtenerEstatusFinal(it) === "faltante").length;
  const sobrantes = itemsHoy.filter((it) => obtenerEstatusFinal(it) === "sobrante").length;
  const valorizadoContadoHoy = itemsHoy.reduce((s, it) => s + it.valorizado, 0);
  const diferenciaNetaHoy = itemsHoy.reduce((s, it) => s + obtenerDiferenciaFinal(it), 0);

  const porFamiliaHoy = {};
  itemsHoy.forEach((it) => {
    if (!porFamiliaHoy[it.familia]) porFamiliaHoy[it.familia] = { familia: it.familia, contados: 0, diferencia: 0 };
    porFamiliaHoy[it.familia].contados += 1;
    porFamiliaHoy[it.familia].diferencia += obtenerDiferenciaFinal(it);
  });
  const familiasArr = Object.values(porFamiliaHoy).sort((a, b) => Math.abs(b.diferencia) - Math.abs(a.diferencia));
  const diferenciasHoy = itemsHoy.filter((it) => obtenerEstatusFinal(it) !== "cuadrado")
    .sort((a, b) => Math.abs(obtenerDiferenciaFinal(b)) - Math.abs(obtenerDiferenciaFinal(a)));

  const fechaTxt = new Date().toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const filasFamilias = familiasArr.map((f) => {
    const color = f.diferencia < 0 ? "#E5484D" : f.diferencia > 0 ? "#B9760A" : "#1C9A7C";
    return '<tr><td>' + esc(f.familia) + '</td><td>' + f.contados + '</td><td style="color:' + color + ';font-weight:700;">' + soles(f.diferencia) + '</td></tr>';
  }).join("");
  const filasDif = diferenciasHoy.slice(0, 80).map((it) => {
    const estFinal = obtenerEstatusFinal(it);
    const dif = obtenerDiferenciaFinal(it);
    const color = dif < 0 ? "#E5484D" : "#B9760A";
    return '<tr><td>' + esc(it.codigo_nisira) + '</td><td>' + esc(it.descripcion) + '</td><td>' + esc(it.familia) + '</td>' +
      '<td>' + it.cantidad_sistema + '</td><td>' + obtenerCantidadFinal(it) + '</td><td>' + (ESTATUS_LABEL[estFinal] || estFinal) + '</td>' +
      '<td style="color:' + color + ';font-weight:700;">' + soles(dif) + '</td></tr>';
  }).join("");

  const html = '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<title>Resumen de Conteo Diario - ' + fechaTxt + '</title>' +
    '<style>' +
    'body{font-family:"Segoe UI",system-ui,sans-serif;background:#F5F7FB;color:#101733;margin:0;padding:24px;}' +
    'h1{font-size:20px;margin:0 0 4px;} .sub{color:#5B6482;font-size:13px;margin:0 0 20px;}' +
    '.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}' +
    '.kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(11,22,87,.06);border-top:3px solid #0B1657;}' +
    '.kpi .label{font-size:11px;color:#5B6482;font-weight:600;margin:0;} .kpi .value{font-size:22px;font-weight:800;margin:4px 0 0;}' +
    'table{border-collapse:collapse;width:100%;font-size:13px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(11,22,87,.06);margin-bottom:24px;}' +
    'th{background:#EEF0F8;text-align:left;padding:8px 10px;color:#5B6482;} td{padding:8px 10px;border-bottom:1px solid #F1F2F8;}' +
    '.panel-title{font-size:14px;font-weight:700;margin:0 0 10px;}' +
    '@media print { .no-print{display:none;} }' +
    '</style></head><body>' +
    '<h1>Resumen de Conteo Diario — Grupo Friopacking</h1>' +
    '<p class="sub">' + fechaTxt + ' · CD Lurín</p>' +
    '<button class="no-print" onclick="window.print()" style="margin-bottom:20px;background:#0B1657;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;">Imprimir / Guardar como PDF</button>' +
    '<div class="kpis">' +
    '<div class="kpi"><p class="label">Ítems contados hoy</p><p class="value">' + totalHoy + '</p></div>' +
    '<div class="kpi"><p class="label">Cuadrados</p><p class="value" style="color:#1C9A7C;">' + cuadrados + '</p></div>' +
    '<div class="kpi"><p class="label">Faltantes</p><p class="value" style="color:#E5484D;">' + faltantes + '</p></div>' +
    '<div class="kpi"><p class="label">Sobrantes</p><p class="value" style="color:#B9760A;">' + sobrantes + '</p></div>' +
    '<div class="kpi"><p class="label">Valorizado contado</p><p class="value">' + soles(valorizadoContadoHoy) + '</p></div>' +
    '<div class="kpi"><p class="label">Diferencia neta</p><p class="value" style="color:' + (diferenciaNetaHoy < 0 ? "#E5484D" : "#B9760A") + ';">' + soles(diferenciaNetaHoy) + '</p></div>' +
    '</div>' +
    '<p class="panel-title">Diferencias por familia (hoy)</p>' +
    '<table><thead><tr><th>Familia</th><th>Ítems contados</th><th>Diferencia valorizada</th></tr></thead><tbody>' +
    (filasFamilias || '<tr><td colspan="3">Sin datos</td></tr>') + '</tbody></table>' +
    '<p class="panel-title">Detalle de diferencias (hoy)</p>' +
    '<table><thead><tr><th>Código</th><th>Descripción</th><th>Familia</th><th>Sistema</th><th>Contado</th><th>Estado</th><th>Diferencia</th></tr></thead><tbody>' +
    (filasDif || '<tr><td colspan="7">Sin diferencias hoy</td></tr>') + '</tbody></table>' +
    '</body></html>';

  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
}

function manejarArchivoExcel(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const wb = XLSX.read(evt.target.result, { type: "array" });
      const hoja = wb.Sheets[wb.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, { defval: "" });
      const porCodigo = new Map();
      filas.forEach((fila) => {
        const m = mapearFilaExcel(fila);
        if (!m.codigo_nisira || !m.descripcion) return;
        const codigo = String(m.codigo_nisira).trim();
        const cantidadFila = Number(m.cantidad_sistema) || 0;
        let costoFila = Number(m.costo_unitario) || 0;
        if (!costoFila && m.valorizado && cantidadFila) costoFila = +(Number(m.valorizado) / cantidadFila).toFixed(4);
        const sucursal = String(m.sucursal || "").trim();
        const almacen = String(m.almacen || "").trim() || "Sin almacén";

        if (!porCodigo.has(codigo)) {
          porCodigo.set(codigo, {
            descripcion: String(m.descripcion).trim(),
            familia: String(m.familia || "Sin familia").trim(),
            subgrupo: String(m.subgrupo || "Sin subgrupo").trim(),
            unidad: String(m.unidad || "UND").trim(),
            costo_unitario: costoFila,
            cantidad_sistema: 0,
            almacenes: new Map(),
          });
        }
        const acc = porCodigo.get(codigo);
        acc.cantidad_sistema += cantidadFila;
        if (costoFila) acc.costo_unitario = costoFila;
        const claveAlmacen = sucursal + "||" + almacen;
        if (!acc.almacenes.has(claveAlmacen)) acc.almacenes.set(claveAlmacen, { sucursal, almacen, cantidad: 0 });
        acc.almacenes.get(claveAlmacen).cantidad += cantidadFila;
      });
      const nuevos = Array.from(porCodigo.entries()).map(([codigo, acc]) => ({
        id: "cod-" + codigo,
        codigo_nisira: codigo,
        descripcion: acc.descripcion,
        familia: acc.familia,
        subgrupo: acc.subgrupo,
        unidad: acc.unidad,
        cantidad_sistema: acc.cantidad_sistema,
        costo_unitario: acc.costo_unitario,
        desglose_almacenes: Array.from(acc.almacenes.values()),
        estado: "pendiente", conteo: null,
      }));
      state.confirmImport = nuevos.length === 0 ? { error: true } : { nuevos };
    } catch (err) {
      state.confirmImport = { error: true };
    }
    render();
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
}

function leerFormularioConteo() {
  const cantidadStr = (document.getElementById("inpCantidad") || {}).value;
  const ubicacion = ((document.getElementById("inpUbicacion") || {}).value || "").trim();
  const cantidadSeparadaStr = (document.getElementById("inpCantidadSeparada") || {}).value;
  const observacion = ((document.getElementById("inpObservacionOp") || {}).value || "").trim();
  const cantidadContada = Number(cantidadStr);
  if (cantidadStr === "" || cantidadStr === undefined || Number.isNaN(cantidadContada) || !ubicacion) {
    state.errorConteoForm = "Completa la cantidad contada y la ubicación (ambas son obligatorias) antes de guardar.";
    return null;
  }
  state.errorConteoForm = "";
  const cantidadSeparada = cantidadSeparadaStr === "" || cantidadSeparadaStr === undefined ? null : Number(cantidadSeparadaStr);
  return { cantidadContada, ubicacion, cantidadSeparada, observacion };
}

root.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");

  if (action === "desbloquear-sitio") {
    desbloquearSitio();
  } else if (action === "elegir-rol") {
    state.loginRol = el.getAttribute("data-rol"); state.loginError = ""; render();
  } else if (action === "cambiar-rol") {
    state.loginRol = null; state.loginError = ""; render();
  } else if (action === "ingresar") {
    doIngresar();
  } else if (action === "salir") {
    state.user = null; state.activoItemId = null; state.busqueda = ""; state.gestionTab = "tablero"; state.operarioTab = "conteo"; render();
  } else if (action === "cambiar-tab-gestion") {
    state.gestionTab = el.getAttribute("data-tab"); render();
  } else if (action === "cambiar-tab-operario") {
    state.operarioTab = el.getAttribute("data-tab"); render();
  } else if (action === "exportar-historico-excel") {
    exportarHistoricoExcel();
  } else if (action === "generar-dashboard-diario") {
    generarDashboardDiario();
  } else if (action === "abrir-item") {
    state.activoItemId = el.getAttribute("data-id"); state.errorConteoForm = ""; state.avisoPreguardadoId = null; render();
    setTimeout(() => { const i = document.getElementById("inpCantidad"); if (i) i.focus(); }, 0);
  } else if (action === "cerrar-item") {
    state.activoItemId = null; state.errorConteoForm = ""; state.avisoPreguardadoId = null; render();
  } else if (action === "cerrar-aviso-conteo") {
    state.avisoConteo = null; render();
  } else if (action === "preguardar-conteo") {
    const id = el.getAttribute("data-id");
    const datos = leerFormularioConteo();
    if (!datos) { render(); return; }
    const original = state.items.find((it) => it.id === id);
    const itemActualizado = Object.assign({}, original, {
      estado: "preguardado",
      conteoBorrador: { cantidad_contada: datos.cantidadContada, ubicacion: datos.ubicacion, cantidad_separada: datos.cantidadSeparada, observacion: datos.observacion },
    });
    await persistItemUnico(itemActualizado);
    state.avisoPreguardadoId = id;
    render();
  } else if (action === "pedir-finalizar-conteo") {
    const id = el.getAttribute("data-id");
    const item = state.items.find((it) => it.id === id);
    const datos = leerFormularioConteo();
    if (!datos) { render(); return; }
    const cantidad_base = datos.cantidadContada + (datos.cantidadSeparada || 0);
    let estatus = "cuadrado";
    if (cantidad_base < item.cantidad_sistema) estatus = "faltante";
    else if (cantidad_base > item.cantidad_sistema) estatus = "sobrante";
    const diferencia_valorizada = +((cantidad_base - item.cantidad_sistema) * item.costo_unitario).toFixed(2);
    state.confirmFinalizarConteo = {
      id, cantidad_contada: datos.cantidadContada, ubicacion: datos.ubicacion,
      cantidad_separada: datos.cantidadSeparada, observacion: datos.observacion, cantidad_base, estatus, diferencia_valorizada,
    };
    render();
  } else if (action === "cancelar-finalizar-conteo") {
    state.confirmFinalizarConteo = null; render();
  } else if (action === "confirmar-finalizar-conteo") {
    const c = state.confirmFinalizarConteo;
    const item = state.items.find((it) => it.id === c.id);
    const personal = state.user.nombre;
    // El conteo finalizado pasa directo al historial (ya no existe aprobación de conteos).
    const conteo = {
      cantidad_contada: c.cantidad_contada, ubicacion: c.ubicacion, personal, cantidad_separada: c.cantidad_separada, observacion: c.observacion,
      cantidad_base: c.cantidad_base, estatus: c.estatus, diferencia_valorizada: c.diferencia_valorizada, fecha: new Date().toISOString(),
      ajuste: 0, cantidad_final: c.cantidad_base, estatus_final: c.estatus, diferencia_valorizada_final: c.diferencia_valorizada,
      vuelta: item.vuelta || 1, observacionGestion: "",
    };
    const itemActualizado = Object.assign({}, item, { estado: "contado", conteo, conteoBorrador: null });
    await persistItemUnico(itemActualizado);

    const hoy = hoyISO();
    const lotesHoy = (state.lotes || []).filter((l) => l.date === hoy);
    const pendientesRestantes = lotesHoy.reduce((total, lote) => {
      return total + lote.ids.filter((lid) => {
        const it2 = state.items.find((x) => x.id === lid);
        return it2 && (it2.estado === "pendiente" || it2.estado === "preguardado");
      }).length;
    }, 0);

    state.confirmFinalizarConteo = null;
    state.activoItemId = null;
    state.avisoPreguardadoId = null;
    state.avisoConteo = { tipo: (lotesHoy.length > 0 && pendientesRestantes === 0) ? "final" : "item", codigo: item.codigo_nisira };
    render();
  } else if (action === "abrir-file") {
    const fi = document.getElementById("fileImport"); if (fi) fi.click();
  } else if (action === "pedir-reset") {
    state.confirmReset = true; render();
  } else if (action === "cerrar-modal-reset") {
    state.confirmReset = false; render();
  } else if (action === "confirmar-reset") {
    await reiniciarTodosLosItems();
    await eliminarTodosLosLotes();
    state.confirmReset = false;
    render();
  } else if (action === "cerrar-modal-import") {
    state.confirmImport = null; render();
  } else if (action === "confirmar-import") {
    // Se refresca justo antes de fusionar, para no pisar conteos hechos por otros
    // mientras Gestión tenía este archivo abierto.
    const itemsActuales = (await cargarItemsDesdeTabla()) || state.items;
    const anteriores = new Map(itemsActuales.map((it) => [it.codigo_nisira, it]));
    const fusionados = state.confirmImport.nuevos.map((nuevo) => {
      const previo = anteriores.get(nuevo.codigo_nisira);
      if (!previo) return nuevo;
      if (previo.estado === "contado") {
        return Object.assign({}, nuevo, { id: previo.id, estado: previo.estado, conteo: previo.conteo });
      }
      if (previo.estado === "preguardado") {
        return Object.assign({}, nuevo, { id: previo.id, estado: previo.estado, conteoBorrador: previo.conteoBorrador });
      }
      return Object.assign({}, nuevo, { id: previo.id });
    });
    const clasificados = computeABC(fusionados);
    await persistItemsBulk(clasificados);
    await persistGlobalStats(calcularStatsGlobales(clasificados));
    state.confirmImport = null;
    render();
  } else if (action === "pedir-generar-lista") {
    const seleccion = Array.from(document.querySelectorAll(".subgrupo-check:checked"))
      .map((cb) => ({ familia: cb.getAttribute("data-familia"), subgrupo: cb.getAttribute("data-subgrupo") }));
    const tamano = Number((document.getElementById("inpTamanoLote") || {}).value) || LOTE_SIZE;
    const asignadoA = (document.getElementById("selAsignarOperario") || {}).value || "";
    state.confirmGenerarLista = { seleccion, tamano, asignadoA };
    render();
  } else if (action === "cerrar-modal-generar-lista") {
    state.confirmGenerarLista = null; render();
  } else if (action === "confirmar-generar-lista") {
    const seleccion = state.confirmGenerarLista.seleccion;
    const tamano = state.confirmGenerarLista.tamano;
    const asignadoA = state.confirmGenerarLista.asignadoA;
    if (!asignadoA) { render(); return; }
    const familias = Array.from(new Set(seleccion.map((s) => s.familia)));
    const idsExcluir = idsComprometidos(state.lotes, state.items);
    const plan = planificarLista(state.items, seleccion, tamano, idsExcluir);
    // Subgrupos ya completados: se abre una nueva vuelta. El conteo anterior se archiva
    // (queda en el histórico) y los ítems vuelven a quedar pendientes de contar.
    if (plan.resetIds.size > 0) {
      const reabiertos = state.items.filter((it) => plan.resetIds.has(it.id)).map((it) => Object.assign({}, it, {
        conteosPrevios: (it.conteosPrevios || []).concat(it.conteo ? [Object.assign({}, it.conteo, { vuelta: it.vuelta || 1 })] : []),
        vuelta: (it.vuelta || 1) + 1, estado: "pendiente", conteo: null, conteoBorrador: null,
      }));
      await persistItemsParcial(reabiertos);
    }
    const nuevoLote = {
      id: "lote-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      date: hoyISO(), ids: plan.ids, familias, asignadoA, vueltas: plan.vueltas,
      generadoPor: state.user.nombre, generadoFecha: new Date().toISOString(),
    };
    await persistLoteUnico(nuevoLote);
    state.confirmGenerarLista = null;
    render();
  } else if (action === "alternar-grupo") {
    const target = document.getElementById(el.getAttribute("data-target"));
    if (target) target.classList.toggle("hidden");
    return;
  } else if (action === "guardar-observacion-historico") {
    const id = el.getAttribute("data-id");
    const vuelta = Number(el.getAttribute("data-vuelta")) || 1;
    const inp = Array.from(document.querySelectorAll(".obs-gestion-input")).find((x) => x.getAttribute("data-id") === id && Number(x.getAttribute("data-vuelta")) === vuelta);
    const texto = inp ? inp.value.trim() : "";
    await guardarObservacionGestion(id, vuelta, texto);
    state.obsGuardadaKey = id + "|" + vuelta;
    render();
  }
});

      familiaCheck.indeterminate = marcados > 0 && marcados < total;
    }
    return;
  }
});

(async function init() {
  const cargados = await cargarItemsDesdeTabla();
  if (cargados === null) {
    // Error de conexión real: no sembrar nada, solo mostrar el aviso de "sin conexión".
    state.items = [];
  } else if (cargados.length === 0) {
    // Tabla vacía de verdad (primera vez que corre esta versión): migrar desde el
    // bloque antiguo si existe, o sembrar datos de muestra.
    let legado = await storageGet("items-master");
    if (!legado) legado = seedMockItems();
    await persistItemsBulk(legado);
  } else {
    state.items = cargados;
  }

  const lotesCargados = await cargarLotesDesdeTabla();
  if (lotesCargados === null) {
    state.lotes = [];
  } else if (lotesCargados.length === 0) {
    const lotesAntiguos = await storageGet("lotes");
    if (lotesAntiguos && lotesAntiguos.length) {
      for (const lote of lotesAntiguos) await persistLoteUnico(lote);
    } else {
      const loteAntiguo = await storageGet("daily-batch");
      if (loteAntiguo) {
        const migrado = Object.assign({ id: "lote-migrado-" + Date.now() }, loteAntiguo);
        await persistLoteUnico(migrado);
      } else {
        state.lotes = [];
      }
    }
  } else {
    state.lotes = lotesCargados;
  }

  const statsGuardadas = await storageGet("global-stats");
  if (statsGuardadas) state.globalStats = statsGuardadas;

  state.cargando = false;
  render();
})();
</script>
</body>
</html>
